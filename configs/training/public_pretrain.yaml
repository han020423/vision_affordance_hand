schema_version: 1
experiment:
  id: public_pretrain_d_seed42
  stage: public_data_pretraining
  description: 이후 실험 D 미세조정을 위한 Aff-Grasp와 UMD 통합 사전학습
  dataset_version: data/processed/yolo_public/dataset_version.json

training:
  model: models/pretrained/yolo11n-seg.pt
  data: data/processed/yolo_public/dataset.yaml
  epochs: 80
  imgsz: 640
  batch: -1
  device: 0
  workers: 8
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 20
  amp: true
  cache: false
  seed: 42
  deterministic: true
  val: true
  plots: true
  save: true
  save_period: 10
  project: outputs/training
  name: public_pretrain_d_seed42
  exist_ok: false

  # affordance 마스크 형상을 훼손하지 않도록 보수적인 증강만 사용한다.
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 10.0
  translate: 0.1
  scale: 0.3
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.0
