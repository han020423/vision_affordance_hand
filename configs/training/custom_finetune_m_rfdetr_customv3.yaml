  stage: custom_data_finetuning
  description: 실험 M - RF-DETR-Seg Nano를 자체 v3(가위·드라이버 추가)+공개 v2 replay 혼합으로 미세조정
  dataset_version: data/processed/rfdetr_mixed_grasp_type_customv3/rfdetr_export_manifest.json
  comparison_group: grasp_type_lineage_detr
