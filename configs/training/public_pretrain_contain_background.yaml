schema_version: 1
experiment:
  id: public_pretrain_d_contain_background_seed42
  stage: public_data_pretraining_policy_ablation
  description: UMD contain 샘플의 grasp를 보존하고 contain은 YOLO에서 암묵적 배경으로 사용하는 비교 실험
  dataset_version: data/processed/yolo_public_contain_background/dataset_version.json
  source_baseline: public_pretrain_d_seed42
  policy_note: 통합 라벨의 contain=ignore는 바꾸지 않으며 YOLO 학습 변환본에만 실험적 예외를 적용함

training:
  model: models/pretrained/yolo11n-seg.pt
  data: data/processed/yolo_public_contain_background/dataset.yaml
  epochs: 80
  imgsz: 640
  batch: -1
  device: 0
  workers: 8
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  cos_lr: true
  patience: 20
  amp: true
  cache: false
  seed: 42
  deterministic: true
  val: true
  plots: true
  save: true
  save_period: 10
  project: outputs/training
  name: public_pretrain_d_contain_background_seed42
  exist_ok: false

  # 기존 기준 모델과 데이터 정책만 비교할 수 있도록 나머지 증강 설정은 동일하게 유지한다.
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.3
  degrees: 10.0
  translate: 0.1
  scale: 0.3
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.0
