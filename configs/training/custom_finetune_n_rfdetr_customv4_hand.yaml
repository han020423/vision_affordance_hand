schema_version: 1
experiment:
  id: custom_finetune_n_rfdetr_customv4_hand_seed42
  stage: custom_data_finetuning
  description: 실험 N - v3 혼합 데이터에 robot_hand 4번 클래스(젯슨 손 프레임 155장)를 추가한 v4로 미세조정
  dataset_version: data/processed/rfdetr_mixed_grasp_type_customv4/rfdetr_export_manifest.json
  comparison_group: grasp_type_lineage_detr
  comparison_note: >
    실험 M과 모델·하이퍼파라미터가 같고 데이터만 v3→v4로 바뀐다. v4는 젯슨 실환경
    손 프레임(승인 155장: train 116, valid 39)에 robot_hand=4 클래스를 추가하고,
    머그 동반 프레임에는 handle/body 의사라벨 101개를 병합했다(functional 의사라벨은
    손·장비 오검출로 확인되어 전부 제외). M 대비 차이는 (a) robot_hand 검출 능력,
    (b) 실환경 배경(흰 천, 파워서플라이)의 음성 학습 효과다. 기존 1~3 클래스 라벨은 불변.

training:
  variant: RFDETRSegNano
  dataset_dir: data/processed/rfdetr_mixed_grasp_type_customv4
  output_dir: outputs/training/custom_finetune_n_rfdetr_customv4_hand_seed42
  seed: 42
  train_args:
    epochs: 50
    batch_size: 8
    grad_accum_steps: 2
    lr: 0.0001
    early_stopping: true
